<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">Hi there, I'm Nikita</title>
  <desc id="desc">An animated terminal with drifting stars and a blinking cursor.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#1e1e2e" />
      <stop offset="1" stop-color="#181825" />
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#89b4fa" />
      <stop offset=".5" stop-color="#cba6f7" />
      <stop offset="1" stop-color="#94e2d5" />
    </linearGradient>
  </defs>
  <rect width="960" height="220" rx="18" fill="url(#bg)" />
  <g fill="#cba6f7" opacity=".35">
    <circle cx="760" cy="50" r="3">
      <animate attributeName="cy" values="50;35;50" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="860" cy="155" r="4">
      <animate attributeName="cy" values="155;175;155" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="680" cy="180" r="2">
      <animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="910" cy="65" r="2">
      <animate attributeName="opacity" values="1;.2;1" dur="5s" repeatCount="indefinite" />
    </circle>
  </g>
  <g transform="translate(36 30)">
    <circle cx="0" cy="0" r="5" fill="#f38ba8" />
    <circle cx="20" cy="0" r="5" fill="#f9e2af" />
    <circle cx="40" cy="0" r="5" fill="#a6e3a1" />
  </g>
  <g font-family="Consolas, 'Liberation Mono', monospace">
    <text x="36" y="86" fill="#a6adc8" font-size="15">troubleShooter239@github ~</text>
    <text x="36" y="128" fill="url(#accent)" font-size="30" font-weight="700">Hi there, I'm Nikita</text>
    <text x="36" y="171" fill="#cdd6f4" font-size="17">$ building stuff that works... probably...</text>
    <rect x="468" y="155" width="10" height="20" rx="1" fill="#94e2d5">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" calcMode="discrete" repeatCount="indefinite" />
    </rect>
  </g>
  <rect x="36" y="202" width="888" height="2" rx="1" fill="url(#accent)" opacity=".5" />
</svg>