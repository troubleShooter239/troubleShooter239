<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title desc"><title id="title">Hi there, I'm Nikita</title><desc id="desc">An animated terminal with drifting stars and a blinking cursor.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#303446" /><stop offset="1" stop-color="#292c3c" /></linearGradient><linearGradient id="accent"><stop stop-color="#8caaee" /><stop offset=".5" stop-color="#ca9ee6" /><stop offset="1" stop-color="#81c8be" /></linearGradient></defs><rect width="960" height="220" rx="18" fill="url(#bg)" /><g fill="#ca9ee6" opacity=".35"><circle cx="760" cy="50" r="3"><animate attributeName="cy" values="50;35;50" dur="6s" repeatCount="indefinite" /></circle><circle cx="860" cy="155" r="4"><animate attributeName="cy" values="155;175;155" dur="7s" repeatCount="indefinite" /></circle><circle cx="680" cy="180" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite" /></circle><circle cx="910" cy="65" r="2"><animate attributeName="opacity" values="1;.2;1" dur="5s" repeatCount="indefinite" /></circle></g><g transform="translate(36 30)"><circle cx="0" cy="0" r="5" fill="#e78284" /><circle cx="20" cy="0" r="5" fill="#e5c890" /><circle cx="40" cy="0" r="5" fill="#a6d189" /></g><g font-family="Consolas, 'Liberation Mono', monospace"><text x="36" y="86" fill="#a5adce" font-size="15">troubleShooter239@github ~</text><text x="36" y="128" fill="url(#accent)" font-size="30" font-weight="700">Hi there, I'm Nikita</text><text x="36" y="171" fill="#c6d0f5" font-size="17">$ building stuff that works... probably...</text><rect x="468" y="155" width="10" height="20" rx="1" fill="#81c8be"><animate attributeName="opacity" values="1;0;1" dur="1.2s" calcMode="discrete" repeatCount="indefinite" /></rect></g><rect x="36" y="202" width="888" height="2" rx="1" fill="url(#accent)" opacity=".5" /></svg>
